# ---------------------------------------------------------------
#  Site settings — edit these first.
# ---------------------------------------------------------------

title: Théodore Michel
description: >-
  Théodore Michel — postdoctoral researcher in computational fluid dynamics and machine learning
  at the Physics of Fluids group, University of Twente.
url: "https://theodore-michel.github.io"
baseurl: ""                       # leave empty for a <username>.github.io repository
lang: en

author:
  name: Théodore Michel
  nickname: Teddy                  # shown under your name on the home page (leave empty to hide)
  pronouns: he/him
  # Every spelling of your name that appears in author lists — these get bolded.
  aliases:
    - Théodore Michel
    - Theodore Michel
    - T. Michel
  title: Postdoctoral Researcher
  affiliation: Physics of Fluids group, University of Twente
  affiliation_url: "https://pof.tnw.utwente.nl/"
  location: Enschede, the Netherlands
  photo: /assets/img/profile.png
  cv_pdf: /assets/cv/cv.pdf

# Contact / social links — shown as icon buttons on the home page and footer.
# Remove a line (or leave it empty) to hide that icon.
social:
  email: theodore.michel@utwente.nl
  github: theodore-michel                                        # GitHub username
  scholar: "sjxk_lMAAAAJ"
  linkedin: "theodore-michel-bb0192174"                          # just the part after linkedin.com/in/
  orcid: "0009-0004-1161-7337"
  twitter: ""                                                    # optional, X/Twitter handle without @
  bluesky: ""                                                    # optional, e.g. you.bsky.social

# Sections you can switch on or off. `false` removes the section entirely:
# its pages, its link in the nav bar and (for the blog) the posts and RSS feed.
# You can keep editing the content while it's hidden; flip to `true` to publish.
sections:
  blog: false
  adventures: false

# Top navigation bar. Items with `section:` only show when that section is on.
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Blog
    url: /blog/
    section: blog
  - title: CV
    url: /cv/
  - title: Adventures
    url: /adventures/
    section: adventures

# ---------------------------------------------------------------
#  Build settings — you normally don't need to touch these.
# ---------------------------------------------------------------
permalink: /blog/:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: /blog/feed.xml
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
