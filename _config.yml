# ---------------------------------------------------------------
#  Site settings — edit these first.
#  Anything marked TODO is a placeholder you should replace.
# ---------------------------------------------------------------

title: Theodore Michel            # TODO: shown in the browser tab and nav bar
description: >-                   # TODO: used for search engines / link previews
  Personal website of Theodore Michel — research, publications, blog and more.
url: "https://theodore-michel.github.io"   # TODO: https://<your-github-username>.github.io
baseurl: ""                       # leave empty for a <username>.github.io repository
lang: en

author:
  name: Theodore Michel           # TODO
  # Every spelling of your name that appears in author lists — these get bolded.
  aliases:
    - Theodore Michel
    - T. Michel
  title: PhD Researcher           # TODO: e.g. "PhD Student", "Research Scientist"
  affiliation: Your Lab, Your University   # TODO
  affiliation_url: "https://example.org"   # TODO
  location: City, Country         # TODO
  photo: /assets/img/profile.svg  # TODO: replace with e.g. /assets/img/profile.jpg (square, ≥ 400px)
  cv_pdf: /assets/cv/cv.pdf       # TODO: drop your real CV at this path

# Contact / social links — shown as icon buttons on the home page and footer.
# Remove a line (or leave it empty) to hide that icon.
social:
  email: herodote110@gmail.com                                   # TODO: the address you want public
  github: theodore-michel                                        # GitHub username
  scholar: "YOUR_SCHOLAR_ID"                                     # TODO: the ?user=XXXX part of your Scholar URL
  linkedin: "your-linkedin-handle"                               # TODO: linkedin.com/in/<handle>
  orcid: ""                                                      # optional, e.g. 0000-0002-1825-0097
  twitter: ""                                                    # optional, X/Twitter handle without @
  bluesky: ""                                                    # optional, e.g. you.bsky.social

# Top navigation bar
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Blog
    url: /blog/
  - title: CV
    url: /cv/
  - title: Adventures
    url: /adventures/

# ---------------------------------------------------------------
#  Build settings — you normally don't need to touch these.
# ---------------------------------------------------------------
permalink: /blog/:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: /blog/feed.xml
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
