# ---------------------------------------------------------------
permalink: /blog/:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: /blog/feed.xml
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
